# 令牌经 ?token= 传给 WebSocket（浏览器无法给握手请求加自定义头），
# 默认的 combined 日志格式会把整条 URL 写进磁盘，等于把会话令牌记在日志里。
#
# 这个 format 用 $uri 而不是 $request_uri：路径保留，查询串丢弃。
# 引用它的站点配置见 sites-available/xiangqi.example.com。
log_format chess_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status '
                      '$body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time';
